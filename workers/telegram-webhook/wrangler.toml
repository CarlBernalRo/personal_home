name = "gastos-hogar-telegram"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Workers AI: reads the screenshots (free daily allowance, inside your own Cloudflare account)
[ai]
binding = "AI"

# Scheduled jobs (UTC). Colombia is UTC-5, so 12:07 UTC = 7:07 a.m., 13:00 UTC = 8:00 a.m., Monday 00:00 UTC = Sunday 7 p.m.
#  - every 10 minutes: forwards the new notifications to Telegram
#  - every day at 12:07: stores the automatic debits that fell due
#  - every day at 13:00: the daily "pendientes" digest
#  - every Monday at 00:00 (Sunday 7 p.m. Colombia): the weekly close
[triggers]
crons = ["*/10 * * * *", "7 12 * * *", "0 13 * * *", "0 0 * * 1"]
